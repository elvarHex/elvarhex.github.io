<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elvarHex</title>
<link rel="icon" href="https://avatars.githubusercontent.com/u/244383582">
<style>
  :root {
    --primary: #7c3aed;
    --primary-glow: rgba(124, 58, 237, 0.35);
    --bg: #09090b;
    --surface: rgba(24, 24, 27, 0.7);
    --surface-hover: rgba(39, 39, 42, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(124, 58, 237, 0.6);
    --text: #fafafa;
    --text-muted: #a1a1aa;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 50% 0%, var(--primary-glow) 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(124, 58, 237, 0.15) 0%, transparent 45%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 2rem;
    line-height: 1.5;
  }

  main {
    width: 100%;
    max-width: 820px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3.5rem;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1.25rem;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .avatar {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    border: 2px solid var(--primary);
    box-shadow: 0 0 30px var(--primary-glow);
    object-fit: cover;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .avatar:hover {
    transform: scale(1.05);
    box-shadow: 0 0 45px var(--primary-glow);
  }

  .hero h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 30%, #c4b5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero p {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    color: var(--text-muted);
    max-width: 540px;
  }

  section {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .section-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    font-weight: 700;
  }

  .social-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }

  .social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: var(--surface);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.95rem 1.25rem;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .social-btn:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px var(--primary-glow);
  }

  .social-btn svg {
    width: 20px;
    height: 20px;
    fill: #ffffff;
    flex-shrink: 0;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.25rem;
  }

  .project-card {
    background: var(--surface);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 1.25rem;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .project-card:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
    transform: translateY(-4px);
    box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.6), 0 0 20px var(--primary-glow);
  }

  .project-header {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .project-logo {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    object-fit: cover;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .project-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    width: 100%;
    flex-wrap: wrap;
  }

  .project-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }

  .project-stars {
    font-size: 0.85rem;
    font-weight: 600;
    color: #fde047;
    background: rgba(253, 224, 71, 0.1);
    border: 1px solid rgba(253, 224, 71, 0.2);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .project-desc {
    font-size: 0.92rem;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .project-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: auto;
  }

  .project-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.65rem 1rem;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .btn-github {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-github:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
  }

  .btn-website {
    background: var(--primary);
    color: #ffffff;
    border: 1px solid transparent;
  }

  .btn-website:hover {
    filter: brightness(1.15);
    box-shadow: 0 0 15px var(--primary-glow);
  }

  footer {
    margin-top: 4rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    width: 100%;
    max-width: 820px;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>

<main>
  <header class="hero">
    <img src="https://avatars.githubusercontent.com/u/244383582" alt="elvarHex" class="avatar">
    <h1>Hi, I'm elvarHex</h1>
    <p>A simple developer with no experience, blending ideas and passions</p>
  </header>

  <section>
    <h2 class="section-title">Pages and social media</h2>
    <div class="social-grid">
      <a href="https://github.com/elvarHex" target="_blank" rel="noopener noreferrer" class="social-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
        </svg>
        <span>GitHub profile</span>
      </a>

      <a href="https://www.instagram.com/elvarhex" target="_blank" rel="noopener noreferrer" class="social-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"></path>
        </svg>
        <span>Instagram</span>
      </a>
    </div>
  </section>

  <section>
    <h2 class="section-title">Featured projects</h2>
    <div class="projects-grid">
      <div class="project-card" 
           data-repo="https://github.com/elvarHex/CookingDesk" 
           data-logo="https://github.com/elvarHex/CookingDesk/raw/main/.github/assets/logo.svg" 
           data-website="/CookingDesk/">
      </div>
    </div>
  </section>
</main>

<footer>
  © 2026 elvarHex · elvarhex.github.io
</footer>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const cards = document.querySelectorAll(".project-card");

    cards.forEach(async (card) => {
      const repoUrl = card.getAttribute("data-repo");
      const logoUrl = card.getAttribute("data-logo");
      const websiteUrl = card.getAttribute("data-website");

      if (!repoUrl) return;

      const repoPath = repoUrl.replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "");
      const defaultName = repoPath.split("/")[1] || "Project";

      card.innerHTML = `
        <div class="project-header">
          <img src="${logoUrl}" alt="${defaultName}" class="project-logo">
          <div class="project-title-row">
            <h3 class="project-title">${defaultName}</h3>
            <span class="project-stars">0 ⭐</span>
          </div>
        </div>
        <p class="project-desc">Loading project details...</p>
        <div class="project-actions">
          <a href="${repoUrl}" target="_blank" rel="noopener noreferrer" class="project-btn btn-github">GitHub</a>
          ${websiteUrl ? `<a href="${websiteUrl}" target="_blank" rel="noopener noreferrer" class="project-btn btn-website">Website</a>` : ""}
        </div>
      `;

      try {
        const response = await fetch(`https://api.github.com/repos/${repoPath}`);
        if (!response.ok) throw new Error();
        const data = await response.json();

        card.querySelector(".project-title").textContent = data.name || defaultName;
        card.querySelector(".project-stars").textContent = `${data.stargazers_count ?? 0} ⭐`;
        card.querySelector(".project-desc").textContent = data.description || "No description provided.";
      } catch {
        card.querySelector(".project-desc").textContent = "Unable to load repository description.";
      }
    });
  });
</script>

</body>
</html>
